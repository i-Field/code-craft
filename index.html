<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Craft — Генератор кодов</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1f38;
    --card: #222849;
    --accent: #6c8cff;
    --accent2: #8b5cf6;
    --text: #e8eaf6;
    --muted: #9aa3c7;
    --border: #2f3760;
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #2a2f5e 0%, transparent 60%),
                radial-gradient(900px 500px at -10% 110%, #1d2447 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wrap { max-width: 1100px; width: 100%; margin: 0 auto; }
  
  header { text-align: center; margin-bottom: 24px; position: relative; }
  .lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .lang-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: .85rem;
    transition: .2s;
  }
  .lang-btn:hover { color: var(--text); border-color: var(--accent); }
  .lang-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }

  /* Брендинг iField */
  .brand-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .logo-text {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--text), var(--muted));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    box-shadow: 0 4px 15px rgba(108,140,255,.3);
  }

  h1 {
    font-size: 2.1rem;
    letter-spacing: .5px;
    background: linear-gradient(90deg, #8fb0ff, #b28cff, #8fb0ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .subtitle { color: var(--muted); margin-top: 6px; font-size: .95rem; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--card));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .card h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section { margin-top: 20px; }
  .section:first-of-type { margin-top: 0; }
  .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .type-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 10px;
    cursor: pointer;
    text-align: center;
    font-size: .9rem;
    transition: .2s;
  }
  .type-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .type-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(108,140,255,.22), rgba(139,92,246,.22));
    box-shadow: 0 0 0 1px var(--accent) inset;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: .85rem;
    color: var(--muted);
    margin: 12px 0 5px;
  }
  input[type=number], input[type=text], textarea {
    width: 100%;
    background: #141930;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .95rem;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; font-family: inherit; }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 5px; }
  .check-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 14px;
    font-size: .9rem;
    color: var(--text);
    cursor: pointer;
  }
  .check-row input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .btn-primary {
    width: 100%;
    margin-top: 18px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 1.05rem;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .count-badge {
    background: rgba(108,140,255,.15);
    border: 1px solid var(--accent);
    color: #aebeff;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
  }
  .codes-box {
    background: #12162b;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-height: 210px;
    max-height: 440px;
    overflow-y: auto;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: .9rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .placeholder { color: var(--muted); }
  .code-line {
    display: flex;
    gap: 10px;
    padding: 3px 0;
    border-bottom: 1px dashed rgba(47,55,96,.6);
  }
  .code-line:last-child { border-bottom: none; }
  .num { color: var(--muted); min-width: 30px; text-align: right; user-select: none; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn-ghost {
    flex: 1;
    min-width: 110px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--accent); color: #fff; }

  /* Футер iField_Lab */
  .main-footer {
    margin-top: 40px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .footer-content {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
  }
  .lab-name { font-weight: 700; color: var(--text); }
  .footer-content a {
    color: var(--accent2);
    text-decoration: none;
    font-weight: 600;
    transition: .2s;
  }
  .footer-content a:hover { color: var(--accent); text-decoration: underline; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(80px);
    background: #252c52;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: .9rem;
    opacity: 0;
    transition: .3s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang-bar">
      <button class="lang-btn active" data-lang="ru">🇷🇺 Русский</button>
      <button class="lang-btn" data-lang="en">🇬🇧 English</button>
      <button class="lang-btn" data-lang="uk">🇺🇦 Українська</button>
    </div>
    
    <div class="brand-box">
      <span class="logo-text">iField</span>
      <div class="logo-icon">CC</div>
    </div>

    <h1 data-i18n="title">Генератор кодов</h1>
    <p class="subtitle" data-i18n="subtitle">Создавайте промокоды, пароли, серийники и UUID мгновенно</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>⚙️ <span data-i18n="settingsTitle">Настройки генерации</span></h2>

      <h2>🔤 <span data-i18n="typeTitle">Тип кода</span></h2>
      <div class="type-grid" id="typeGrid"></div>

      <div class="section">
        <label data-i18n="count">Количество</label>
        <input type="number" id="count" value="10" min="1" max="10000">

        <label data-i18n="length">Длина</label>
        <input type="number" id="length" value="12" min="4" max="128">

        <label data-i18n="separator">Разделитель</label>
        <input type="text" id="separator" value="-" maxlength="3">

        <label data-i18n="prefix">Префикс</label>
        <input type="text" id="prefix" placeholder="Например: PROMO-">

        <label data-i18n="suffix">Суффикс</label>
        <input type="text" id="suffix" placeholder="Например: -2026">

        <label data-i18n="charset">Свой набор символов</label>
        <textarea id="charset" placeholder="Оставьте пустым — используется набор по умолчанию"></textarea>
        <div class="hint" data-i18n="charsetHint">Пусто — используется набор по умолчанию</div>

        <label class="check-row">
          <input type="checkbox" id="upper">
          <span data-i18n="upper">Только заглавные буквы</span>
        </label>
        <label class="check-row">
          <input type="checkbox" id="unique">
          <span data-i18n="unique">Уникальные коды (без повторов)</span>
        </label>

        <button class="btn btn-primary" id="genBtn">✨ Сгенерировать</button>
      </div>
    </div>

    <div class="card">
      <div class="result-head">
        <h2 style="margin-bottom:0">📦 <span data-i18n="resultTitle">Результат</span></h2>
        <span class="count-badge" id="countBadge">0 кодов</span>
      </div>
      <div class="codes-box" id="output"><span class="placeholder" data-i18n="placeholderOutput">Нажмите «Сгенерировать», чтобы увидеть коды…</span></div>
      <div class="actions">
        <button class="btn btn-ghost" id="copyBtn">📋 Копировать</button>
        <button class="btn btn-ghost" id="downloadBtn">💾 Скачать .txt</button>
        <button class="btn btn-ghost" id="qrBtn">🔳 QR (1-й код)</button>
        <button class="btn btn-ghost" id="clearBtn">🗑 Очистить</button>
      </div>
    </div>
  </div>
</div>

<footer class="main-footer">
  <div class="footer-content">
    <span class="lab-name">iField_lab</span>
    <span>by</span>
    <a href="https://github.com/i-field" target="_blank">Kiiashko Roman</a>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const I18N = {
  ru: {
    title: 'Генератор кодов',
    subtitle: 'Создавайте промокоды, пароли, серийники и UUID мгновенно',
    settingsTitle: 'Настройки генерации',
    typeTitle: 'Тип кода',
    count: 'Количество',
    length: 'Длина',
    separator: 'Разделитель',
    prefix: 'Префикс',
    suffix: 'Суффикс',
    charset: 'Свой набор символов',
    charsetHint: 'Пусто — используется набор по умолчанию',
    upper: 'Только заглавные буквы',
    unique: 'Уникальные коды (без повторов)',
    generate: '✨ Сгенерировать',
    resultTitle: 'Результат',
    copy: '📋 Копировать',
    download: '💾 Скачать .txt',
    qr: '🔳 QR (1-й код)',
    clear: '🗑 Очистить',
    placeholderOutput: 'Нажмите «Сгенерировать», чтобы увидеть коды…',
    codes: 'кодов',
    toastCopied: 'Скопировано!',
    toastEmpty: 'Сначала сгенерируйте коды',
    toastGenerated: 'Сгенерировано: ',
    toastQR: 'Открываю QR-код…',
    types: {
      promo: 'Промокод',
      serial: 'Серийник',
      password: 'Пароль',
      pin: 'PIN-код',
      hex: 'HEX',
      uuid: 'UUID v4'
    }
  },
  en: {
    title: 'Code Generator',
    subtitle: 'Create promo codes, passwords, serials and UUIDs instantly',
    settingsTitle: 'Generation Settings',
    typeTitle: 'Code Type',
    count: 'Count',
    length: 'Length',
    separator: 'Separator',
    prefix: 'Prefix',
    suffix: 'Suffix',
    charset: 'Custom character set',
    charsetHint: 'Empty — default set for the selected type is used',
    upper: 'Uppercase only',
    unique: 'Unique codes (no duplicates)',
    generate: '✨ Generate',
    resultTitle: 'Result',
    copy: '📋 Copy',
    download: '💾 Download .txt',
    qr: '🔳 QR (1st code)',
    clear: '🗑 Clear',
    placeholderOutput: 'Click «Generate» to see the codes…',
    codes: 'codes',
    toastCopied: 'Copied!',
    toastEmpty: 'Generate codes first',
    toastGenerated: 'Generated: ',
    toastQR: 'Opening QR code…',
    types: {
      promo: 'Promo code',
      serial: 'Serial key',
      password: 'Password',
      pin: 'PIN code',
      hex: 'HEX',
      uuid: 'UUID v4'
    }
  },
  uk: {
    title: 'Генератор кодів',
    subtitle: 'Створюйте промокоди, паролі, серійники та UUID миттєво',
    settingsTitle: 'Налаштування генерації',
    typeTitle: 'Тип коду',
    count: 'Кількість',
    length: 'Довжина',
    separator: 'Розділювач',
    prefix: 'Префікс',
    suffix: 'Суфікс',
    charset: 'Власний набір символів',
    charsetHint: 'Порожньо — використовується набір за замовчуванням',
    upper: 'Тільки великі літери',
    unique: 'Унікальні коди (без повторів)',
    generate: '✨ Згенерувати',
    resultTitle: 'Результат',
    copy: '📋 Копіювати',
    download: '💾 Завантажити .txt',
    qr: '🔳 QR (1-й код)',
    clear: '🗑 Очистити',
    placeholderOutput: 'Натисніть «Згенерувати», щоб побачити коди…',
    codes: 'кодів',
    toastCopied: 'Скопійовано!',
    toastEmpty: 'Спочатку згенеруйте коди',
    toastGenerated: 'Згенеровано: ',
    toastQR: 'Відкриваю QR-код…',
    types: {
      promo: 'Промокод',
      serial: 'Серійник',
      password: 'Пароль',
      pin: 'PIN-код',
      hex: 'HEX',
      uuid: 'UUID v4'
    }
  }
};

const TYPES = [
  { id: 'promo', chars: 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789' },
  { id: 'serial', chars: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789' },
  { id: 'password', chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{};:,.<>?' },
  { id: 'pin', chars: '0123456789' },
  { id: 'hex', chars: '0123456789abcdef' },
  { id: 'uuid', chars: '' }
];

let currentLang = localStorage.getItem('genLang') || 'ru';
let currentType = 'promo';
let lastCodes = [];

const typeGrid = document.getElementById('typeGrid');
const output = document.getElementById('output');
const countBadge = document.getElementById('countBadge');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function rnd(n) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % n;
}

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('genLang', lang);

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });

  document.getElementById('genBtn').textContent = I18N[lang].generate;
  document.getElementById('copyBtn').textContent = I18N[lang].copy;
  document.getElementById('downloadBtn').textContent = I18N[lang].download;
  document.getElementById('qrBtn').textContent = I18N[lang].qr;
  document.getElementById('clearBtn').textContent = I18N[lang].clear;

  renderTypes();
  updateBadge();
}

function renderTypes() {
  typeGrid.innerHTML = '';
  TYPES.forEach(type => {
    const b = document.createElement('button');
    b.className = 'type-btn' + (type.id === currentType ? ' active' : '');
    b.textContent = I18N[currentLang].types[type.id];
    b.onclick = () => { currentType = type.id; renderTypes(); };
    typeGrid.appendChild(b);
  });
}

function buildCharset(type) {
  const custom = document.getElementById('charset').value.trim();
  let chars = custom || TYPES.find(x => x.id === type).chars;
  if (document.getElementById('upper').checked) chars = chars.toUpperCase();
  return chars;
}

function fallbackUUID() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  let s = '';
  for (let i = 0; i < 36; i++) {
    if ([8, 13, 18, 23].includes(i)) s += '-';
    else if (i === 14) s += '4';
    else {
      const r = crypto.getRandomValues(new Uint8Array(1))[0];
      s += '0123456789abcdef'[i === 19 ? (r & 0x3) | 0x8 : r % 16];
    }
  }
  return s;
}

function generateOne(type, len, sep, chars) {
  if (type === 'uuid') return fallbackUUID();
  let core = '';
  for (let i = 0; i < len; i++) core += chars[rnd(chars.length)];
  
  if (sep && type === 'serial' && len > 4) {
    const chunkSize = 4;
    const regex = new RegExp(`.{1,${chunkSize}}`, 'g');
    core = core.match(regex).join(sep);
  }
  return core;
}

function generateCodes() {
  const count = parseInt(document.getElementById('count').value) || 1;
  const len = parseInt(document.getElementById('length').value) || 12;
  const sep = document.getElementById('separator').value;
  const prefix = document.getElementById('prefix').value;
  const suffix = document.getElementById('suffix').value;
  const isUnique = document.getElementById('unique').checked;
  const chars = buildCharset(currentType);

  if (currentType !== 'uuid' && chars.length === 0) return;

  const results = new Set();
  let attempts = 0;
  const maxAttempts = count * 20;

  while (results.size < count && attempts < maxAttempts) {
    attempts++;
    const core = generateOne(currentType, len, sep, chars);
    const code = `${prefix}${core}${suffix}`;
    if (isUnique) {
      results.add(code);
    } else {
      lastCodes.push(code);
      if (lastCodes.length === count) break;
    }
  }

  lastCodes = isUnique ? Array.from(results) : lastCodes.slice(-count);

  renderResults();
  showToast(`${I18N[currentLang].toastGenerated}${lastCodes.length}`);
}

function renderResults() {
  if (lastCodes.length === 0) {
    output.innerHTML = `<span class="placeholder">${I18N[currentLang].placeholderOutput}</span>`;
    updateBadge();
    return;
  }

  output.innerHTML = lastCodes.map((code, idx) => `
    <div class="code-line">
      <span class="num">${idx + 1}.</span>
      <span class="val">${escapeHtml(code)}</span>
    </div>
  `).join('');

  updateBadge();
}

function updateBadge() {
  countBadge.textContent = `${lastCodes.length} ${I18N[currentLang].codes}`;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
}

// Event Listeners
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

document.getElementById('genBtn').addEventListener('click', generateCodes);

document.getElementById('copyBtn').addEventListener('click', () => {
  if (!lastCodes.length) return showToast(I18N[currentLang].toastEmpty);
  navigator.clipboard.writeText(lastCodes.join('\n'));
  showToast(I18N[currentLang].toastCopied);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!lastCodes.length) return showToast(I18N[currentLang].toastEmpty);
  const blob = new Blob([lastCodes.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `codes_${Date.now()}.txt`;
  a.click();
});

document.getElementById('qrBtn').addEventListener('click', () => {
  if (!lastCodes.length) return showToast(I18N[currentLang].toastEmpty);
  showToast(I18N[currentLang].toastQR);
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(lastCodes[0])}`;
  window.open(qrUrl, '_blank');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  lastCodes = [];
  renderResults();
});

// Init
applyLanguage(currentLang);
</script>
</body>
</html>
